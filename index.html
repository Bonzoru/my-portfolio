    <!--
      Resolve the theme before first paint so there is no flash of the wrong
      colours. An explicit choice in localStorage wins; otherwise follow the OS.
      Kept inline and tiny on purpose: it must run before the CSS applies.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0b0d12');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
